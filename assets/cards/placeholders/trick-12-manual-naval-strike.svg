<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-12-manual-naval-strike" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#004b75" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-12-manual-naval-strike" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00b0ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00b0ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-12-manual-naval-strike" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-12-manual-naval-strike)" />
  <rect width="400" height="400" fill="url(#grid-trick-12-manual-naval-strike)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-12-manual-naval-strike)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#00b0ff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#00b0ff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#00b0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#00b0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#00b0ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#00b0ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Torpedo Bomber Diving -->
      <path d="M 120 70 L 210 110 L 260 90 L 240 125 L 280 145 L 200 135 L 140 100 Z" fill="#1e293b" stroke="#00b0ff" stroke-width="4"/>
      <!-- Dropped Torpedo -->
      <rect x="190" y="165" width="45" height="12" rx="6" fill="#00b0ff" transform="rotate(30 210 170)"/>
      <!-- Water splash / Target -->
      <path d="M 80 230 Q 200 210 320 230" stroke="#00b0ff" stroke-width="4" fill="none"/>
      <line x1="210" y1="190" x2="240" y2="240" stroke="#00b0ff" stroke-width="2" stroke-dasharray="4 4"/>
    
  </g>

  </svg>
