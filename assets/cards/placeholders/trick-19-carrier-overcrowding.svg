<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-19-carrier-overcrowding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-19-carrier-overcrowding" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd600" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffd600" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffd600" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-19-carrier-overcrowding" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-19-carrier-overcrowding)" />
  <rect width="400" height="400" fill="url(#grid-trick-19-carrier-overcrowding)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-19-carrier-overcrowding)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ffd600" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffd600" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ffd600" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ffd600" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ffd600" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ffd600" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Aircraft Carrier Flat Deck -->
      <polygon points="60,170 110,140 330,140 350,170 300,195 90,195" fill="#1e293b" stroke="#ffd600" stroke-width="4"/>
      <!-- Deck Flight Line Strip -->
      <line x1="120" y1="155" x2="310" y2="155" stroke="#ffd600" stroke-width="3" stroke-dasharray="8 6"/>
      <!-- Flight Swarm Arrows -->
      <polygon points="170,110 185,120 175,125" fill="#ffd600"/>
      <polygon points="210,95 225,105 215,110" fill="#ffd600"/>
      <polygon points="250,80 265,90 255,95" fill="#ffd600"/>
      <polygon points="280,65 295,75 285,80" fill="#ffd600"/>
    
  </g>

  </svg>
