<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-17-paradrop-victory-points" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#6200ea" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-17-paradrop-victory-points" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffab00" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffab00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffab00" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-17-paradrop-victory-points" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-17-paradrop-victory-points)" />
  <rect width="400" height="400" fill="url(#grid-trick-17-paradrop-victory-points)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-17-paradrop-victory-points)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ffab00" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffab00" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ffab00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ffab00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ffab00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ffab00" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Paratroopers Canopy -->
      <path d="M 120 110 A 80 70 0 0 1 280 110 Z" fill="#6200ea" stroke="#ffab00" stroke-width="4"/>
      <line x1="120" y1="110" x2="200" y2="160" stroke="#ffab00" stroke-width="2"/>
      <line x1="160" y1="110" x2="200" y2="160" stroke="#ffab00" stroke-width="2"/>
      <line x1="240" y1="110" x2="200" y2="160" stroke="#ffab00" stroke-width="2"/>
      <line x1="280" y1="110" x2="200" y2="160" stroke="#ffab00" stroke-width="2"/>
      <!-- Capital Star / VP Symbol -->
      <polygon points="200,180 207,200 228,200 211,213 218,233 200,220 182,233 189,213 172,200 193,200" fill="#ffab00" stroke="#fff" stroke-width="2"/>
    
  </g>

  </svg>
