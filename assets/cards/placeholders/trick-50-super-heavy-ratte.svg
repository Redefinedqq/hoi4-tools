<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-50-super-heavy-ratte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#881337" stop-opacity="0.65" />
    </linearGradient>
    <radialGradient id="glow-trick-50-super-heavy-ratte" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-50-super-heavy-ratte" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-50-super-heavy-ratte)" />
  <rect width="400" height="400" fill="url(#grid-trick-50-super-heavy-ratte)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-50-super-heavy-ratte)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic: Colossal P.1000 Ratte Landkreuzer -->
  <g transform="translate(0, 20)">
    <!-- Massive Twin Battleship Guns pointing right -->
    <line x1="220" y1="108" x2="350" y2="108" stroke="#f43f5e" stroke-width="9" stroke-linecap="round"/>
    <line x1="220" y1="126" x2="350" y2="126" stroke="#f43f5e" stroke-width="9" stroke-linecap="round"/>
    <!-- Muzzle Brakes -->
    <rect x="335" y="102" width="14" height="12" fill="#fda4af"/>
    <rect x="335" y="120" width="14" height="12" fill="#fda4af"/>

    <!-- Naval Battleship Gun Turret (Sloped frontal armor) -->
    <polygon points="120,145 155,95 240,95 255,145" fill="#1e293b" stroke="#f43f5e" stroke-width="4" stroke-linejoin="round"/>
    <line x1="160" y1="95" x2="145" y2="145" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>

    <!-- Secondary Anti-Aircraft Flak Turret on rear deck -->
    <polygon points="90,145 105,125 125,125 130,145" fill="#4c0519" stroke="#fda4af" stroke-width="2"/>
    <line x1="95" y1="125" x2="75" y2="105" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="125" x2="85" y2="100" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>

    <!-- Landkreuzer Fortress Hull -->
    <polygon points="65,195 90,145 285,145 315,195" fill="#0f172a" stroke="#f43f5e" stroke-width="4" stroke-linejoin="round"/>

    <!-- Triple Caterpillar Tracks (Colossal suspension system) -->
    <rect x="55" y="195" width="270" height="36" rx="10" fill="#1e293b" stroke="#fda4af" stroke-width="3"/>
    <!-- Road wheels -->
    <circle cx="85" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
    <circle cx="125" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
    <circle cx="165" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
    <circle cx="205" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
    <circle cx="245" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
    <circle cx="285" cy="213" r="11" fill="#4c0519" stroke="#fda4af" stroke-width="2.5"/>
  </g>
</svg>
