<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-35-trophy-conversion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-35-trophy-conversion" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd180" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffd180" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffd180" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-35-trophy-conversion" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-35-trophy-conversion)" />
  <rect width="400" height="400" fill="url(#grid-trick-35-trophy-conversion)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-35-trophy-conversion)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ffd180" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffd180" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ffd180" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ffd180" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ffd180" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ffd180" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- Tank chassis with conversion arrow into SPG Cannon -->
    <!-- Tank hull -->
    <rect x="110" y="150" width="180" height="50" rx="8" fill="#1e293b" stroke="#ffd180" stroke-width="3"/>
    <!-- Tracks -->
    <rect x="95" y="190" width="210" height="24" rx="10" fill="#0f172a" stroke="#ffd180" stroke-width="2"/>
    <circle cx="120" cy="202" r="7" fill="#ffd180"/>
    <circle cx="160" cy="202" r="7" fill="#ffd180"/>
    <circle cx="200" cy="202" r="7" fill="#ffd180"/>
    <circle cx="240" cy="202" r="7" fill="#ffd180"/>
    <circle cx="280" cy="202" r="7" fill="#ffd180"/>
    <!-- SPG Open Casemate -->
    <polygon points="130,150 150,90 230,90 250,150" fill="#e65100" stroke="#ffd180" stroke-width="3"/>
    <!-- Massive Heavy Gun -->
    <line x1="220" y1="115" x2="330" y2="85" stroke="#ffd180" stroke-width="8" stroke-linecap="round"/>
    <rect x="315" y="78" width="16" height="14" fill="#ffd180"/>
    <!-- Circular conversion recycle arrows -->
    <path d="M 80 110 A 35 35 0 0 1 130 80" fill="none" stroke="#ffd180" stroke-width="4" stroke-linecap="round"/>
    <polygon points="135,70 135,90 120,80" fill="#ffd180"/>
  </g>
</svg>