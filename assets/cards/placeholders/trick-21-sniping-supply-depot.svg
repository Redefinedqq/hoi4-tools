<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-21-sniping-supply-depot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-21-sniping-supply-depot" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#76ff03" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#76ff03" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#76ff03" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-21-sniping-supply-depot" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-21-sniping-supply-depot)" />
  <rect width="400" height="400" fill="url(#grid-trick-21-sniping-supply-depot)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-21-sniping-supply-depot)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#76ff03" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#76ff03" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#76ff03" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#76ff03" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#76ff03" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#76ff03" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Supply Depot Building -->
      <rect x="140" y="130" width="120" height="90" rx="4" fill="#1e293b" stroke="#76ff03" stroke-width="4"/>
      <polygon points="120,130 200,80 280,130" fill="#1b5e20" stroke="#76ff03" stroke-width="3"/>
      <!-- Sniper Crosshairs -->
      <circle cx="200" cy="150" r="45" fill="none" stroke="#ff1744" stroke-width="3"/>
      <circle cx="200" cy="150" r="10" fill="#ff1744"/>
      <line x1="200" y1="95" x2="200" y2="205" stroke="#ff1744" stroke-width="2"/>
      <line x1="145" y1="150" x2="255" y2="150" stroke="#ff1744" stroke-width="2"/>
    
  </g>

  </svg>
