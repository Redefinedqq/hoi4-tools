<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-10-space-marines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#6a0080" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-10-space-marines" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#e040fb" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#e040fb" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-10-space-marines" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-10-space-marines)" />
  <rect width="400" height="400" fill="url(#grid-trick-10-space-marines)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-10-space-marines)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#e040fb" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#e040fb" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#e040fb" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#e040fb" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#e040fb" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#e040fb" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Heavy Iron Skull / Helmet -->
      <path d="M 140 100 C 140 60, 260 60, 260 100 L 255 170 L 225 210 L 175 210 L 145 170 Z" fill="#1e293b" stroke="#e040fb" stroke-width="4"/>
      <!-- Glowing Visor -->
      <polygon points="160,115 240,115 230,135 170,135" fill="#e040fb"/>
      <!-- Armor Chevron Plate -->
      <path d="M 120 180 L 200 230 L 280 180 L 200 260 Z" fill="#6a0080" opacity="0.6" stroke="#e040fb" stroke-width="3"/>
    
  </g>

  </svg>
