<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-39-destroyer-swarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#006064" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-39-destroyer-swarm" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#18ffff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#18ffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#18ffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-39-destroyer-swarm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-39-destroyer-swarm)" />
  <rect width="400" height="400" fill="url(#grid-trick-39-destroyer-swarm)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-39-destroyer-swarm)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#18ffff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#18ffff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#18ffff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#18ffff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#18ffff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#18ffff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- 3 Destroyers in echelon with torpedo spreads -->
    <!-- Destroyer 1 (Lead) -->
    <polygon points="120,110 240,110 280,122 240,134 120,134 110,122" fill="#1e293b" stroke="#18ffff" stroke-width="2.5"/>
    <line x1="170" y1="122" x2="220" y2="122" stroke="#18ffff" stroke-width="3"/>
    <!-- Destroyer 2 -->
    <polygon points="80,160 190,160 230,172 190,184 80,184 70,172" fill="#1e293b" stroke="#18ffff" stroke-width="2.5"/>
    <!-- Destroyer 3 -->
    <polygon points="150,210 260,210 300,222 260,234 150,234 140,222" fill="#1e293b" stroke="#18ffff" stroke-width="2.5"/>
    <!-- Torpedo wake tracks branching out -->
    <line x1="280" y1="122" x2="360" y2="105" stroke="#18ffff" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="280" y1="122" x2="360" y2="135" stroke="#18ffff" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="230" y1="172" x2="340" y2="165" stroke="#18ffff" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="230" y1="172" x2="340" y2="190" stroke="#18ffff" stroke-width="2" stroke-dasharray="6 3"/>
    <line x1="300" y1="222" x2="370" y2="235" stroke="#18ffff" stroke-width="2" stroke-dasharray="6 3"/>
  </g>
</svg>