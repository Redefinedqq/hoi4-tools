<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-26-railway-guns-barrage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-26-railway-guns-barrage" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff5252" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ff5252" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ff5252" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-26-railway-guns-barrage" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-26-railway-guns-barrage)" />
  <rect width="400" height="400" fill="url(#grid-trick-26-railway-guns-barrage)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-26-railway-guns-barrage)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ff5252" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ff5252" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ff5252" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ff5252" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ff5252" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Rail tracks -->
      <line x1="60" y1="240" x2="340" y2="240" stroke="#ff5252" stroke-width="4"/>
      <!-- Dora Carriage -->
      <rect x="100" y="200" width="180" height="35" rx="4" fill="#1e293b" stroke="#ff5252" stroke-width="4"/>
      <circle cx="130" cy="235" r="10" fill="#0f172a" stroke="#ff5252" stroke-width="3"/>
      <circle cx="170" cy="235" r="10" fill="#0f172a" stroke="#ff5252" stroke-width="3"/>
      <circle cx="210" cy="235" r="10" fill="#0f172a" stroke="#ff5252" stroke-width="3"/>
      <circle cx="250" cy="235" r="10" fill="#0f172a" stroke="#ff5252" stroke-width="3"/>
      <!-- Massive Gun Barrel Elevated 35 deg -->
      <polygon points="160,200 300,90 315,108 175,210" fill="#ff5252"/>
      <polygon points="295,85 320,105 328,95 303,75" fill="#fff"/>
    
  </g>

  </svg>
