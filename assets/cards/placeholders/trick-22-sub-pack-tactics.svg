<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-22-sub-pack-tactics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#004d40" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-22-sub-pack-tactics" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-22-sub-pack-tactics" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-22-sub-pack-tactics)" />
  <rect width="400" height="400" fill="url(#grid-trick-22-sub-pack-tactics)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-22-sub-pack-tactics)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Submarine 1 -->
      <path d="M 120 120 C 160 110, 240 110, 270 120 C 240 130, 160 130, 120 120 Z" fill="#1e293b" stroke="#00e5ff" stroke-width="3"/>
      <rect x="180" y="105" width="20" height="15" fill="#00e5ff"/>
      <!-- Submarine 2 -->
      <path d="M 80 170 C 120 160, 200 160, 230 170 C 200 180, 120 180, 80 170 Z" fill="#1e293b" stroke="#00e5ff" stroke-width="3"/>
      <rect x="140" y="155" width="20" height="15" fill="#00e5ff"/>
      <!-- Submarine 3 -->
      <path d="M 170 210 C 210 200, 290 200, 320 210 C 290 220, 210 220, 170 210 Z" fill="#1e293b" stroke="#00e5ff" stroke-width="3"/>
      <!-- Sonar Waves -->
      <circle cx="200" cy="160" r="65" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
    
  </g>

  </svg>
