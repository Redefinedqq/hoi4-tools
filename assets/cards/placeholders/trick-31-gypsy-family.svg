<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-31-gypsy-family" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#b26a00" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-31-gypsy-family" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffd54f" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-31-gypsy-family" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-31-gypsy-family)" />
  <rect width="400" height="400" fill="url(#grid-trick-31-gypsy-family)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-31-gypsy-family)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ffd54f" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffd54f" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ffd54f" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ffd54f" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ffd54f" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ffd54f" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- Clan Crown / Wagon Wheel & Swarm -->
    <circle cx="200" cy="170" r="65" fill="none" stroke="#ffd54f" stroke-width="4" stroke-dasharray="12 8"/>
    <circle cx="200" cy="170" r="18" fill="#ffd54f"/>
    <!-- Spokes -->
    <line x1="200" y1="105" x2="200" y2="235" stroke="#ffd54f" stroke-width="3"/>
    <line x1="135" y1="170" x2="265" y2="170" stroke="#ffd54f" stroke-width="3"/>
    <line x1="154" y1="124" x2="246" y2="216" stroke="#ffd54f" stroke-width="3"/>
    <line x1="154" y1="216" x2="246" y2="124" stroke="#ffd54f" stroke-width="3"/>
    <!-- Crown on top -->
    <path d="M 140 100 L 160 55 L 200 80 L 240 55 L 260 100 Z" fill="#b26a00" stroke="#ffd54f" stroke-width="3"/>
    <!-- Swarm nodes -->
    <circle cx="110" cy="80" r="8" fill="#ffd54f"/>
    <circle cx="290" cy="80" r="8" fill="#ffd54f"/>
    <circle cx="90" cy="190" r="7" fill="#ffd54f"/>
    <circle cx="310" cy="190" r="7" fill="#ffd54f"/>
    <circle cx="130" cy="260" r="9" fill="#ffd54f"/>
    <circle cx="270" cy="260" r="9" fill="#ffd54f"/>
  </g>
</svg>