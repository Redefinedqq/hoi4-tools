<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-18-refit-cruiser-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#002f6c" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-18-refit-cruiser-armor" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#448aff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#448aff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#448aff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-18-refit-cruiser-armor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-18-refit-cruiser-armor)" />
  <rect width="400" height="400" fill="url(#grid-trick-18-refit-cruiser-armor)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-18-refit-cruiser-armor)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#448aff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#448aff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#448aff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#448aff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#448aff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#448aff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Cruiser Warship Profile -->
      <path d="M 60 170 L 100 150 L 300 150 L 340 170 L 300 195 L 80 195 Z" fill="#1e293b" stroke="#448aff" stroke-width="4"/>
      <!-- Radar Mast with Tech Scan Ring -->
      <line x1="200" y1="150" x2="200" y2="90" stroke="#448aff" stroke-width="4"/>
      <circle cx="200" cy="90" r="16" fill="none" stroke="#448aff" stroke-width="3" stroke-dasharray="6 4"/>
      <!-- Turrets with Upgrades -->
      <rect x="130" y="138" width="28" height="14" rx="3" fill="#448aff"/>
      <line x1="115" y1="145" x2="135" y2="145" stroke="#448aff" stroke-width="4"/>
      <rect x="250" y="138" width="28" height="14" rx="3" fill="#448aff"/>
      <line x1="240" y1="145" x2="260" y2="145" stroke="#448aff" stroke-width="4"/>
    
  </g>

  </svg>
