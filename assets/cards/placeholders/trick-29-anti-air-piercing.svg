<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-29-anti-air-piercing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-29-anti-air-piercing" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffea00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffea00" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-29-anti-air-piercing" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-29-anti-air-piercing)" />
  <rect width="400" height="400" fill="url(#grid-trick-29-anti-air-piercing)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-29-anti-air-piercing)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#ffea00" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#ffea00" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#ffea00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#ffea00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#ffea00" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#ffea00" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Dual Flak Autocannons Pointing High Angle -->
      <rect x="150" y="190" width="100" height="35" rx="4" fill="#1e293b" stroke="#ffea00" stroke-width="4"/>
      <line x1="175" y1="190" x2="250" y2="70" stroke="#ffea00" stroke-width="8" stroke-linecap="round"/>
      <line x1="195" y1="190" x2="270" y2="70" stroke="#ffea00" stroke-width="8" stroke-linecap="round"/>
      <!-- Tracers / Flak Burst -->
      <polygon points="260,60 275,40 280,65 295,55 285,75 305,80 285,90" fill="#ffea00"/>
    
  </g>

  </svg>
