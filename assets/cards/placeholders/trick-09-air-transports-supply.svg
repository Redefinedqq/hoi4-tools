<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-09-air-transports-supply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#01579b" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-09-air-transports-supply" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#29b6f6" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#29b6f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-09-air-transports-supply" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-09-air-transports-supply)" />
  <rect width="400" height="400" fill="url(#grid-trick-09-air-transports-supply)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-09-air-transports-supply)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#29b6f6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#29b6f6" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#29b6f6" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#29b6f6" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#29b6f6" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#29b6f6" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Transport Plane -->
      <path d="M 110 95 L 200 70 L 290 95 L 220 115 L 200 135 L 180 115 Z" fill="#1e293b" stroke="#29b6f6" stroke-width="4"/>
      <polygon points="195,50 205,50 205,135 195,135" fill="#29b6f6"/>
      <!-- Parachute -->
      <path d="M 150 170 A 50 50 0 0 1 250 170 Z" fill="#29b6f6" opacity="0.7" stroke="#fff" stroke-width="2"/>
      <line x1="150" y1="170" x2="200" y2="210" stroke="#29b6f6" stroke-width="2"/>
      <line x1="250" y1="170" x2="200" y2="210" stroke="#29b6f6" stroke-width="2"/>
      <!-- Supply Crate -->
      <rect x="185" y="210" width="30" height="30" rx="3" fill="#0f172a" stroke="#29b6f6" stroke-width="3"/>
      <line x1="185" y1="210" x2="215" y2="240" stroke="#29b6f6" stroke-width="2"/>
      <line x1="215" y1="210" x2="185" y2="240" stroke="#29b6f6" stroke-width="2"/>
    
  </g>

  </svg>
