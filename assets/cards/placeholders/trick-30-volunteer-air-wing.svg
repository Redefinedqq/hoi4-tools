<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-30-volunteer-air-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#002594" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-30-volunteer-air-wing" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2979ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#2979ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#2979ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-30-volunteer-air-wing" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-30-volunteer-air-wing)" />
  <rect width="400" height="400" fill="url(#grid-trick-30-volunteer-air-wing)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-30-volunteer-air-wing)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#2979ff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#2979ff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#2979ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#2979ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#2979ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#2979ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    
      <!-- Fighter Wings & Star -->
      <polygon points="200,60 215,100 255,100 225,125 235,165 200,140 165,165 175,125 145,100 185,100" fill="#ffd700" stroke="#fff" stroke-width="2"/>
      <!-- Swept Wings -->
      <path d="M 60 180 L 200 140 L 340 180 L 240 210 L 200 190 L 160 210 Z" fill="#1e293b" stroke="#2979ff" stroke-width="4"/>
      <line x1="200" y1="140" x2="200" y2="240" stroke="#2979ff" stroke-width="3" stroke-dasharray="6 4"/>
    
  </g>

  </svg>
