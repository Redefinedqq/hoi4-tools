<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-32-dnepr-defense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#005b9f" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-32-dnepr-defense" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#4dd0e1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-32-dnepr-defense" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-32-dnepr-defense)" />
  <rect width="400" height="400" fill="url(#grid-trick-32-dnepr-defense)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-32-dnepr-defense)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#4dd0e1" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#4dd0e1" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#4dd0e1" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#4dd0e1" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#4dd0e1" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#4dd0e1" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- River Dnepr curving wave -->
    <path d="M 120 40 Q 150 110, 190 140 T 220 220 Q 240 280, 280 300" fill="none" stroke="#00e5ff" stroke-width="22" stroke-linecap="round" opacity="0.4"/>
    <path d="M 120 40 Q 150 110, 190 140 T 220 220 Q 240 280, 280 300" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10"/>
    <!-- Bastion / Fort Shield on East Bank -->
    <path d="M 170 120 L 230 120 L 245 170 L 200 215 L 155 170 Z" fill="#1e293b" stroke="#4dd0e1" stroke-width="4"/>
    <polygon points="185,140 215,140 222,165 200,190 178,165" fill="#005b9f"/>
    <!-- Defense wall crenels -->
    <rect x="160" y="95" width="16" height="18" fill="#4dd0e1"/>
    <rect x="192" y="95" width="16" height="18" fill="#4dd0e1"/>
    <rect x="224" y="95" width="16" height="18" fill="#4dd0e1"/>
  </g>
</svg>