<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-34-single-helmet-spam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#33691e" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-34-single-helmet-spam" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c0ca33" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#c0ca33" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#c0ca33" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-34-single-helmet-spam" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-34-single-helmet-spam)" />
  <rect width="400" height="400" fill="url(#grid-trick-34-single-helmet-spam)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-34-single-helmet-spam)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#c0ca33" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#c0ca33" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#c0ca33" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#c0ca33" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#c0ca33" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#c0ca33" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- Helmets row / echelon -->
    <!-- Helmet 1 (Back left) -->
    <path d="M 90 140 C 90 110, 150 110, 150 140 L 160 145 L 80 145 Z" fill="#2d3748" stroke="#c0ca33" stroke-width="2" opacity="0.7"/>
    <!-- Helmet 2 (Back right) -->
    <path d="M 250 140 C 250 110, 310 110, 310 140 L 320 145 L 240 145 Z" fill="#2d3748" stroke="#c0ca33" stroke-width="2" opacity="0.7"/>
    <!-- Helmet Center (Main) -->
    <path d="M 150 160 C 150 110, 250 110, 250 160 L 265 170 L 135 170 Z" fill="#1e293b" stroke="#c0ca33" stroke-width="4"/>
    <path d="M 135 170 Q 200 178 265 170" stroke="#c0ca33" stroke-width="3"/>
    <!-- 1-BATTALION / 1-HELMET BADGE -->
    <rect x="140" y="195" width="120" height="34" rx="6" fill="#33691e" stroke="#c0ca33" stroke-width="2"/>
    <polygon points="180,203 190,203 186,221 176,221" fill="#c0ca33"/>
    <circle cx="206" cy="212" r="5" fill="#c0ca33"/>
    <polygon points="216,203 226,203 222,221 212,221" fill="#c0ca33"/>
  </g>
</svg>