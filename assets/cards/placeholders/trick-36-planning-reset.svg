<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg-grad-trick-36-planning-reset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#004ba0" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow-trick-36-planning-reset" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#80d8ff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#80d8ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#80d8ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-trick-36-planning-reset" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bg-grad-trick-36-planning-reset)" />
  <rect width="400" height="400" fill="url(#grid-trick-36-planning-reset)" />

  <!-- Tactical Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#glow-trick-36-planning-reset)" />

  <!-- Outer HUD Ring & Crossbars -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#80d8ff" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="125" fill="none" stroke="#80d8ff" stroke-width="1" stroke-opacity="0.2"/>
  <line x1="200" y1="20" x2="200" y2="45" stroke="#80d8ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="200" y1="355" x2="200" y2="380" stroke="#80d8ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="20" y1="200" x2="45" y2="200" stroke="#80d8ff" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="355" y1="200" x2="380" y2="200" stroke="#80d8ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, 30)">
    <!-- Battle Plan Arrow forward -->
    <path d="M 120 180 L 250 180 M 225 155 L 255 180 L 225 205" fill="none" stroke="#80d8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Reset Circular Counter Arrow -->
    <path d="M 230 110 A 65 65 0 1 0 250 195" fill="none" stroke="#00e5ff" stroke-width="5" stroke-dasharray="10 6"/>
    <polygon points="250,110 230,95 240,125" fill="#00e5ff"/>
    <!-- Tactical Target Crosshair -->
    <circle cx="200" cy="180" r="45" fill="none" stroke="#80d8ff" stroke-width="2"/>
    <line x1="200" y1="125" x2="200" y2="235" stroke="#80d8ff" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="145" y1="180" x2="255" y2="180" stroke="#80d8ff" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>