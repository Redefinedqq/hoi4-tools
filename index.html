  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "2D Тир-лист Hearts of Iron IV",
    "url": "https://redefinedqq.github.io/hoi4-tools/",
    "description": "Двумерный интерактивный тир-лист ошибок и механик для мажоров Hearts of Iron IV.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "All",
    "inLanguage": "ru",

      "@type": "Person",

<body>

  <!-- Fullscreen Welcome Screen / Tier-List Selector Modal -->
  <div id="welcome-screen" class="welcome-screen-overlay" role="dialog" aria-modal="true">
    <div class="welcome-container">
      <header class="welcome-header">
        <h1 class="welcome-title">ВЫБЕРИТЕ ТИР-ЛИСТ</h1>
      </header>

      <div class="welcome-cards-grid">
        <!-- Card 1: Ошибки в HOI4 -->
        <div class="welcome-card" id="select-trikiwi-card" role="button" tabindex="0">
          <div class="welcome-card-glow welcome-card-glow-red"></div>
          <h2 class="welcome-card-title">ОШИБКИ В HOI4</h2>
          <div class="welcome-card-badge" id="trikiwi-card-count-badge">
            <i class="fa-solid fa-layer-group"></i>
            <span>30 карточек</span>
          </div>
          <div class="welcome-card-previews">
            <div class="preview-thumb"><img src="assets/cards/card-01-rubber-deficit.webp" alt="Нет резины" title="Нет резины" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/card-13-lost-air.webp" alt="Красный воздух" title="Красный воздух" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/card-18-tanks-no-supply.webp" alt="Горение от снабжения" title="Горение от снабжения" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/card-39-no-fuel-empty.webp" alt="0 топлива" title="0 топлива" loading="lazy" /></div>
          </div>
          <button class="welcome-card-btn btn-trikiwi">
            <span>Открыть тир-лист</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- Card 2: Фишки и механики -->
        <div class="welcome-card" id="select-atom-card" role="button" tabindex="0">
          <div class="welcome-card-glow welcome-card-glow-cyan"></div>
          <h2 class="welcome-card-title">ФИШКИ И МЕХАНИКИ</h2>
          <div class="welcome-card-badge" id="atom-card-count-badge">
            <i class="fa-solid fa-layer-group"></i>
            <span>21 карточка</span>
          </div>
          <div class="welcome-card-previews">
            <div class="preview-thumb"><img src="assets/cards/placeholders/trick-31-gypsy-family.svg" alt="«Цыганская семья» Айдима" title="«Цыганская семья» Айдима" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/placeholders/trick-10-space-marines.svg" alt="Космодесант" title="Космодесант" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/placeholders/trick-33-console-prime.svg" alt="Стройбаты" title="Стройбаты" loading="lazy" /></div>
            <div class="preview-thumb"><img src="assets/cards/placeholders/trick-12-manual-naval-strike.svg" alt="Морбобры" title="Морбобры" loading="lazy" /></div>
          </div>
          <button class="welcome-card-btn btn-atom">
            <span>Открыть тир-лист</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Leave Confirmation Dialog -->
  <div id="leave-confirm-modal" class="confirm-modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="confirm-modal-card">
      <div class="confirm-modal-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="confirm-modal-body">
        <h3 class="confirm-modal-title">Вернуться к выбору тир-листа?</h3>
        <p class="confirm-modal-desc">На текущей доске есть несохраненные карточки. При возврате к меню несохраненный прогресс будет сброшен.</p>
      </div>
      <div class="confirm-modal-actions">
        <button id="cancel-leave-btn" class="btn btn-secondary">
          <i class="fa-solid fa-xmark"></i>
          <span>Остаться</span>
        </button>
        <button id="confirm-leave-btn" class="btn btn-danger">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Да, выйти</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Application Wrapper -->
  <div class="app-wrapper" id="main-app-wrapper">
    <!-- Streamlined Header -->
    <header class="site-header">
      <div class="header-left">
        <button id="back-to-select-btn" class="btn btn-tonal btn-back" title="Вернуться к выбору тир-листа">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Назад</span>
        </button>
        <div class="header-branding">
          <h1 id="brand-title" class="brand-title">ОШИБКИ В HOI 4</h1>
        </div>
      </div>
      <!-- Censorship Toggle (Historical / Censored) -->
      <div class="header-center">
        <div class="censorship-segmented-control" role="group" aria-label="Режим отображения символики">
          <button type="button" id="censor-btn-historical" class="censor-segment-btn" data-censor="historical" title="Исторический (Свободный) режим — оригинальная символика периода 1933–1945">
            <i class="fa-solid fa-landmark"></i>
            <span class="censor-segment-title">Исторический</span>
          </button>
          <button type="button" id="censor-btn-censored" class="censor-segment-btn is-active" data-censor="censored" title="Цензурный режим — нейтральная символика без свастики (для стримов и видео)">
            <i class="fa-solid fa-shield-halved"></i>
            <span class="censor-segment-title">Цензурный</span>
          </button>
        </div>
      </div>
      <div class="header-actions">
        <div class="tray-scale-control" aria-label="Масштаб колоды">
          <span class="tray-scale-title"><i class="fa-solid fa-magnifying-glass"></i> Масштаб колоды:</span>
          <button id="tray-scale-down" class="tray-scale-btn" title="Уменьшить масштаб"><i class="fa-solid fa-minus"></i></button>
          <input type="range" id="tray-scale-slider" min="50" max="200" step="5" value="100" class="tray-scale-slider" title="Ползунок масштаба (двойной клик для сброса на 100%)" />
          <span id="tray-scale-value" class="tray-scale-value" title="Дважды кликните, чтобы сбросить масштаб на 100%">100%</span>
          <button id="tray-scale-up" class="tray-scale-btn" title="Увеличить масштаб"><i class="fa-solid fa-plus"></i></button>
        </div>
        <button id="share-btn" class="btn btn-primary" title="Скопировать ссылку с текущим состоянием тир-листа">
          <i class="fa-solid fa-share-nodes"></i>
          <span>Сохранить / Поделиться</span>
        </button>
        <button id="wallpaper-btn" class="btn btn-tonal" title="Сменить фоновые обои">
          <i class="fa-solid fa-image"></i>
          <span>Обои</span>
        </button>
        <button id="preview-wallpaper-btn" class="btn btn-tonal" title="Посмотреть обои на весь экран">
          <i class="fa-solid fa-eye"></i>
          <span>Просмотр</span>
        </button>
        <button id="undo-btn" class="btn btn-secondary" style="display: none;" title="Восстановить матрицу после сброса">
          <i class="fa-solid fa-rotate-left"></i>
          <span>Вернуть</span>
        </button>
        <button id="reset-matrix-btn" class="btn btn-danger" title="Очистить все клетки матрицы">
          <i class="fa-solid fa-trash-can"></i>
          <span>Сброс</span>
        </button>
      </div>
    </header>

    <!-- Matrix Board Container -->
    <main id="matrix-capture-area" class="matrix-card-wrapper">
      <div class="matrix-scroll-container">
        <div id="matrix-header-row" class="matrix-header-row">
          <!-- Country and Corner Headers (Sticky freeze-pane) -->
        </div>
        <div id="matrix-board" class="matrix-board">
          <!-- Populated dynamically via app.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Cards Strip with Smooth Scroll -->
  <div class="bank-cards-strip-container">
    <div id="bank-cards-tray" class="bank-cards-strip">
      <!-- Populated dynamically via app.js -->
    </div>
  </div>


  <!-- Fullscreen Lightbox Modal (Zoom view & Mechanics Encyclopedia) -->
  <div id="lightbox-modal" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="lightbox-container">
      <button id="lightbox-close-btn" class="lightbox-close-btn" title="Закрыть (Esc)">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="lightbox-image-frame">
        <img id="lightbox-img" class="lightbox-img" src="" alt="" />
      </div>
      <div class="lightbox-info-pane">
        <div id="lightbox-title" class="lightbox-caption-card"></div>
        <div id="lightbox-desc" class="lightbox-desc"></div>
        <div id="lightbox-forum-links" class="lightbox-forum-links"></div>
      </div>
    </div>
  </div>

  <!-- Floating Wallpaper Control Bar (Visible in Wallpaper Preview Mode) -->
  <div id="wallpaper-control-bar" class="wallpaper-control-bar" aria-label="Панель управления обоями">
    <button id="wp-exit-btn" class="toast-btn toast-btn-cancel" title="Выйти из режима просмотра (Esc)">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Назад</span>
    </button>
    <button id="wp-prev-btn" class="toast-btn toast-btn-cancel" title="Предыдущие обои">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <span id="wp-title-label" class="wp-title-text">Обои 1/5</span>
    <button id="wp-next-btn" class="toast-btn toast-btn-cancel" title="Следующие обои">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <!-- M3 Snackbar Notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="app.js" defer></script>
</body>
</html>
